[project]
name = "form-boss"
version = "0.1.0"
description = "Lift form analysis from video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.scripts]
form-boss = "form_boss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/form_boss"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
