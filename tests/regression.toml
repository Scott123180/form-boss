# Clips the regression runner (scripts/regress.py) analyses, and what a correct analysis of each
# must show. `reps` is the number of working reps a person counts by watching the clip; leave it
# out where nobody has counted. Everything else the runner compares against the saved baseline
# (tests/regression_baseline.json) so that changes in findings show up as a diff.
#
# data/user clips are not in git (see data/user/README.md); missing clips are skipped.

[[clip]]
path = "data/user/squat/squat_side_30fps.MOV"
lift = "squat"
reps = 5

[[clip]]
path = "data/user/squat/squat_side_120fps_01.MOV"
lift = "squat"
reps = 5

[[clip]]
path = "data/user/squat/squat_side_120fps_02.MOV"
lift = "squat"
reps = 5

[[clip]]
